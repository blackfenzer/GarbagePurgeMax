[workspace]
members = ["apps/desktop", "crates/scan-engine", "crates/scan-store"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Debug SHA-256 runs at about 120 MiB/s, which stalls duplicate checks during `cargo run`.
[profile.dev.package.sha2]
opt-level = 3
