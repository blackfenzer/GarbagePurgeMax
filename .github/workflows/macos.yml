name: macOS Apple Silicon

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      STORAGE_CLINIC_TOOLCHAIN: 1.100.0-aarch64-apple-darwin
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$STORAGE_CLINIC_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check formatting
        run: rustup run "$STORAGE_CLINIC_TOOLCHAIN" cargo fmt --all -- --check
      - name: Test the workspace
        run: rustup run "$STORAGE_CLINIC_TOOLCHAIN" cargo test --locked --workspace
      - name: Check Clippy
        run: rustup run "$STORAGE_CLINIC_TOOLCHAIN" cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test the SQLite schema
        run: python3 -B crates/scan-store/tests/test_schema.py

      - name: Test native package layouts
        run: python3 -B .github/scripts/test_package.py
      - name: Build Storage Clinic
        run: rustup run "$STORAGE_CLINIC_TOOLCHAIN" cargo build --locked -p storage-clinic
      - name: Build and verify unsigned package
        run: rustup run "$STORAGE_CLINIC_TOOLCHAIN" python3 -B .github/scripts/package.py
      - name: Upload unsigned development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Storage-Clinic-macos-arm64-${{ github.sha }}
          path: target/packages/Storage-Clinic-*-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
