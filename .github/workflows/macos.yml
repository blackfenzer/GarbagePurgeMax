name: macOS Apple Silicon

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      STORAGE_CLINIC_TOOLCHAIN: 1.100.0-aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$STORAGE_CLINIC_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check formatting
        run: rustup run "$STORAGE_CLINIC_TOOLCHAIN" cargo fmt --all -- --check
      - name: Test the workspace
        run: rustup run "$STORAGE_CLINIC_TOOLCHAIN" cargo test --locked --workspace
      - name: Check Clippy
        run: rustup run "$STORAGE_CLINIC_TOOLCHAIN" cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test the SQLite schema
        run: python3 -B crates/scan-store/tests/test_schema.py
      - name: Build Storage Clinic
        run: rustup run "$STORAGE_CLINIC_TOOLCHAIN" cargo build --locked -p storage-clinic
