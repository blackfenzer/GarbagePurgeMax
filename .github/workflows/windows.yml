name: Windows x64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      STORAGE_CLINIC_TOOLCHAIN: 1.100.0-x86_64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check CMake
        run: cmake --version

      - name: Install the MSVC Rust toolchain
        run: rustup toolchain install $env:STORAGE_CLINIC_TOOLCHAIN --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Check formatting
        run: rustup run $env:STORAGE_CLINIC_TOOLCHAIN cargo fmt --all -- --check

      - name: Check Clippy
        run: rustup run $env:STORAGE_CLINIC_TOOLCHAIN cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Test the SQLite schema
        run: python -B crates/scan-store/tests/test_schema.py

      - name: Test native package layouts
        run: python -B .github/scripts/test_package.py

      - name: Run the workspace tests
        run: rustup run $env:STORAGE_CLINIC_TOOLCHAIN cargo test --locked --workspace --target x86_64-pc-windows-msvc

      - name: Build Storage Clinic
        run: rustup run $env:STORAGE_CLINIC_TOOLCHAIN cargo build --locked --bin storage-clinic --target x86_64-pc-windows-msvc
